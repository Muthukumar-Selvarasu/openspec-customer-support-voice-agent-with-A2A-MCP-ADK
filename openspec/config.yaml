schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Repo layout:
  - docs/ FDE stages 0-3 (ENGAGEMENT.md, 01-discovery/, 02-problem-metrics/, 03-poc/)
  - openspec/ spec-driven engine
  - src/ application
  - tests/ verification

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Align with docs/ENGAGEMENT.md and docs/01-discovery, docs/02-problem-metrics, docs/03-poc
  specs:
    - Use SHALL/MUST requirements plus WHEN/THEN scenarios
  design:
    - Make URLs, hosts, and ports env-configurable with localhost defaults
  tasks:
    - Keep tasks as small verifiable steps with test commands
